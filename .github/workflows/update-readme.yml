# ══════════════════════════════════════════════════════════════
#  AHMAD MALIK — Self-Evolving README Workflow
#  Runs automatically every day at 00:30 UTC.
#  Also triggers on workflow dispatch to allow manual runs.
# ══════════════════════════════════════════════════════════════

name: 🤖 Auto-Evolve README

on:
  schedule:
    # Every day at 00:30 UTC to fetch fresh live data
    - cron: "30 0 * * *"

  # Allow manual trigger from the Actions tab in GitHub
  workflow_dispatch:

# Only allow one run at a time (prevents race conditions)
concurrency:
  group: readme-update
  cancel-in-progress: true

jobs:
  evolve:
    name: Fetch Stats & Update README Assets
    runs-on: ubuntu-latest

    # Give the action write access to push the updated assets
    permissions:
      contents: write

    steps:
      # ── 1. Check out the repo ──────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history so git log / commit calculations work
          fetch-depth: 0

      # ── 2. Set up Python ──────────────────────────────────────
      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # ── 3. Install dependencies ───────────────────────────────
      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      # ── 4. Run the evolution engine ───────────────────────────
      # This step runs your Python script to query GitHub API and generate the dynamic SVGs
      - name: 🤖 Run README evolution engine
        env:
          # GITHUB_TOKEN is automatically provided for API access
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Assumes your script content matches the logic provided earlier for live data
        run: python update_readme.py

      # ── 5. Commit & push changes ──────────────────────────────
      # CRITICAL UPDATE: Commits README.md AND the generated 'assets/' SVGs
      - name: 📤 Commit & push updated README and Assets
        run: |
          git config --global user.name  "README-Bot 🤖"
          git config --global user.email "readme-bot@users.noreply.github.com"

          # Stage both README.md and the new asset files
          git add README.md assets/

          # Only commit if there are actual changes detected
          if git diff --staged --quiet; then
            echo "✅ No changes detected in README or Assets."
          else
            TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
            git commit -m "🤖 Auto-sync Profile Metrics · ${TIMESTAMP}"
            git push
            echo "✅ README and Assets pushed successfully with live data!"
          fi
