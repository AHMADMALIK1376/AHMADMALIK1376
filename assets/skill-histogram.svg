<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" width="760" height="320">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap');
      
      text {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      
      .bar { 
        animation: slideUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) both; 
        transform-origin: bottom; 
      }
      .bar:nth-child(1)  { animation-delay: 0.05s; }
      .bar:nth-child(2)  { animation-delay: 0.10s; }
      .bar:nth-child(3)  { animation-delay: 0.15s; }
      .bar:nth-child(4)  { animation-delay: 0.20s; }
      .bar:nth-child(5)  { animation-delay: 0.25s; }
      .bar:nth-child(6)  { animation-delay: 0.30s; }
      .bar:nth-child(7)  { animation-delay: 0.35s; }
      .bar:nth-child(8)  { animation-delay: 0.40s; }
      .bar:nth-child(9)  { animation-delay: 0.45s; }
      .bar:nth-child(10) { animation-delay: 0.50s; }
      
      @keyframes slideUp {
        from { transform: scaleY(0); opacity: 0; }
        to   { transform: scaleY(1); opacity: 1; }
      }
    </style>
    
    <!-- Smooth, light, flat gradients -->
    <linearGradient id="g-expert" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="g-advanced" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="g-proficient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="g-intermediate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="g-basic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="760" height="320" fill="#f8fafc" rx="16"/>
  
  <!-- Subtle grid -->
  <line x1="60" y1="40" x2="60" y2="260" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="60" y1="260" x2="730" y2="260" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="60" y1="208" x2="730" y2="208" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="60" y1="156" x2="730" y2="156" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="60" y1="104" x2="730" y2="104" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="60" y1="52"  x2="730" y2="52"  stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Y labels -->
  <text x="50" y="264" text-anchor="end" fill="#64748b" font-size="10">0</text>
  <text x="50" y="212" text-anchor="end" fill="#64748b" font-size="10">25</text>
  <text x="50" y="160" text-anchor="end" fill="#64748b" font-size="10">50</text>
  <text x="50" y="108" text-anchor="end" fill="#64748b" font-size="10">75</text>
  <text x="50" y="56"  text-anchor="end" fill="#64748b" font-size="10">100</text>

  <!-- Title -->
  <text x="395" y="28" text-anchor="middle" fill="#334155" font-size="14" font-weight="700" letter-spacing="1.5">SKILL PROFICIENCY OVERVIEW</text>

  <!-- BAR GROUP 1 — Python 100% -->
  <g class="bar">
    <rect x="72" y="52" width="46" height="208" fill="url(#g-expert)" rx="6"/>
  </g>
  <text x="95" y="278" text-anchor="middle" fill="#475569" font-size="10" font-weight="600">Python</text>
  <text x="95" y="44"  text-anchor="middle" fill="#3b82f6" font-size="10" font-weight="700">100%</text>

  <!-- BAR GROUP 2 — Node.js 100% -->
  <g class="bar">
    <rect x="130" y="52" width="46" height="208" fill="url(#g-expert)" rx="6" opacity="0.9"/>
  </g>
  <text x="153" y="278" text-anchor="middle" fill="#475569" font-size="10" font-weight="600">Node.js</text>
  <text x="153" y="44"  text-anchor="middle" fill="#3b82f6" font-size="10" font-weight="700">100%</text>

  <!-- BAR GROUP 3 — Playwright 95% -->
  <g class="bar">
    <rect x="188" y="62.4" width="46" height="197.6" fill="url(#g-advanced)" rx="6"/>
  </g>
  <text x="211" y="278" text-anchor="middle" fill="#475569" font-size="10" font-weight="600">Playwright</text>
  <text x="211" y="54"  text-anchor="middle" fill="#6366f1" font-size="10" font-weight="700">95%</text>

  <!-- BAR GROUP 4 — LLM/AI 95% -->
  <g class="bar">
    <rect x="246" y="62.4" width="46" height="197.6" fill="url(#g-advanced)" rx="6" opacity="0.9"/>
  </g>
  <text x="269" y="278" text-anchor="middle" fill="#475569" font-size="10" font-weight="600">LLM/AI</text>
  <text x="269" y="54"  text-anchor="middle" fill="#6366f1" font-size="10" font-weight="700">95%</text>

  <!-- BAR GROUP 5 — TypeScript 80% -->
  <g class="bar">
    <rect x="304" y="93.6" width="46" height="166.4" fill="url(#g-proficient)" rx="6"/>
  </g>
  <text x="327" y="278" text-anchor="middle" fill="#475569" font-size="10" font-weight="600">TypeScript</text>
  <text x="327" y="85"  text-anchor="middle" fill="#10b981" font-size="10" font-weight="700">80%</text>

  <!-- BAR GROUP 6 — JavaScript 80% -->
  <g class="bar">
    <rect x="362" y="93.6" width="46" height="166.4" fill="url(#g-proficient)" rx="6" opacity="0.9"/>
  </g>
  <text x="385" y="278" text-anchor="middle" fill="#475569" font-size="10" font-weight="600">JavaScript</text>
  <text x="385" y="85"  text-anchor="middle" fill="#10b981" font-size="10" font-weight="700">80%</text>

  <!-- BAR GROUP 7 — React 80% -->
  <g class="bar">
    <rect x="420" y="93.6" width="46" height="166.4" fill="url(#g-proficient)" rx="6" opacity="0.8"/>
  </g>
  <text x="443" y="278" text-anchor="middle" fill="#475569" font-size="10" font-weight="600">React</text>
  <text x="443" y="85"  text-anchor="middle" fill="#10b981" font-size="10" font-weight="700">80%</text>

  <!-- BAR GROUP 8 — FastAPI 78% -->
  <g class="bar">
    <rect x="478" y="97.7" width="46" height="162.3" fill="url(#g-proficient)" rx="6" opacity="0.7"/>
  </g>
  <text x="501" y="278" text-anchor="middle" fill="#475569" font-size="10" font-weight="600">FastAPI</text>
  <text x="501" y="89"  text-anchor="middle" fill="#10b981" font-size="10" font-weight="700">78%</text>

  <!-- BAR GROUP 9 — Docker/GCP 76% -->
  <g class="bar">
    <rect x="536" y="101.9" width="46" height="158.1" fill="url(#g-intermediate)" rx="6"/>
  </g>
  <text x="559" y="278" text-anchor="middle" fill="#475569" font-size="10" font-weight="600">Docker/GCP</text>
  <text x="559" y="93"  text-anchor="middle" fill="#f59e0b" font-size="10" font-weight="700">76%</text>

  <!-- BAR GROUP 10 — Java/C++ 55% -->
  <g class="bar">
    <rect x="594" y="145.6" width="46" height="114.4" fill="url(#g-basic)" rx="6"/>
  </g>
  <text x="617" y="278" text-anchor="middle" fill="#475569" font-size="10" font-weight="600">Java / C++</text>
  <text x="617" y="137" text-anchor="middle" fill="#ef4444" font-size="10" font-weight="700">55%</text>

  <!-- Legend -->
  <rect x="65"  y="300" width="10" height="10" fill="#3b82f6" rx="2"/>
  <text x="81"  y="309" fill="#64748b" font-size="9" font-weight="600">EXPERT</text>
  
  <rect x="135" y="300" width="10" height="10" fill="#6366f1" rx="2"/>
  <text x="151" y="309" fill="#64748b" font-size="9" font-weight="600">ADVANCED</text>
  
  <rect x="215" y="300" width="10" height="10" fill="#10b981" rx="2"/>
  <text x="231" y="309" fill="#64748b" font-size="9" font-weight="600">PROFICIENT</text>
  
  <rect x="305" y="300" width="10" height="10" fill="#f59e0b" rx="2"/>
  <text x="321" y="309" fill="#64748b" font-size="9" font-weight="600">INTERMEDIATE</text>
  
  <rect x="405" y="300" width="10" height="10" fill="#ef4444" rx="2"/>
  <text x="421" y="309" fill="#64748b" font-size="9" font-weight="600">BASIC</text>
</svg>
