<svg viewBox="0 0 500 340" xmlns="http://www.w3.org/2000/svg" width="420" height="285">
<defs>
  <style>
    .seg { fill: none; stroke-width: 14; transform-origin: center; stroke-linecap: round; }
    .bg-grid { fill: #f5f0eb; }
    .circuit-line { fill: none; stroke: #d4c5b9; stroke-width: 1; stroke-linecap: round; }
    .dot { fill: #d4c5b9; stroke: #f5f0eb; stroke-width: 1; }
    .text-main { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>
</defs>

<!-- Circuit / Blueprint Background -->
<rect width="500" height="340" class="bg-grid"/>

<pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
  <circle cx="2" cy="2" r="0.8" fill="#e3d8cc"/>
</pattern>
<rect width="500" height="340" fill="url(#dots)"/>

<!-- Circuit Lines & Nodes -->
<path class="circuit-line" d="M40 20 L110 20 L130 40 L230 40 L245 25 L255 25 L270 40 L370 40 L390 20 L460 20"/>
<path class="circuit-line" d="M40 320 L110 320 L130 300 L230 300 L245 315 L255 315 L270 300 L370 300 L390 320 L460 320"/>
<path class="circuit-line" d="M110 60 L110 140 L130 160 L130 260 L110 280"/>
<path class="circuit-line" d="M270 55 L270 285"/>
<path class="circuit-line" d="M450 120 L480 120 L480 220 L450 220"/>

<circle cx="245" cy="25" r="2" class="dot"/>
<circle cx="255" cy="25" r="2" class="dot"/>
<circle cx="245" cy="315" r="2" class="dot"/>
<circle cx="255" cy="315" r="2" class="dot"/>

<!-- Concentric Tracks -->
<circle cx="155" cy="165" r="95" fill="none" stroke="#e8dfd3" stroke-width="14"/>
<circle cx="155" cy="165" r="77" fill="none" stroke="#e8dfd3" stroke-width="14"/>
<circle cx="155" cy="165" r="59" fill="none" stroke="#e8dfd3" stroke-width="14"/>
<circle cx="155" cy="165" r="41" fill="none" stroke="#e8dfd3" stroke-width="14"/>
<circle cx="155" cy="165" r="23" fill="none" stroke="#e8dfd3" stroke-width="14"/>

<!-- Data Arcs -->
<circle class="seg" cx="155" cy="165" r="95" stroke-dasharray="0 597" stroke="#0077C8" transform="rotate(-90 155 165)"/>
<circle class="seg" cx="155" cy="165" r="77" stroke-dasharray="0 484" stroke="#F88379" transform="rotate(-90 155 165)"/>
<circle class="seg" cx="155" cy="165" r="59" stroke-dasharray="0 371" stroke="#F2D24B" transform="rotate(-90 155 165)"/>
<circle class="seg" cx="155" cy="165" r="41" stroke-dasharray="0 258" stroke="#D4A373" transform="rotate(-90 155 165)"/>
<circle class="seg" cx="155" cy="165" r="23" stroke-dasharray="0 145" stroke="hsl(72, 60%, 49%)" transform="rotate(-90 155 165)"/>

<circle cx="155" cy="165" r="12" fill="#D41F26"/>

<!-- Legend (Corrected order: Python -> TS -> JS -> Other -> Java -> C++) -->
<g transform="translate(285, 55)">
  <circle cx="10" cy="10" r="7" fill="#0077C8"/>
  <text x="26" y="14" fill="#2c241d" class="text-main" font-size="10" font-weight="bold">Python</text>
  
  <circle cx="10" cy="35" r="7" fill="#F88379"/>
  <text x="26" y="39" fill="#2c241d" class="text-main" font-size="10" font-weight="bold">TypeScript</text>
  
  <circle cx="10" cy="60" r="7" fill="#F2D24B"/>
  <text x="26" y="64" fill="#2c241d" class="text-main" font-size="10" font-weight="bold">JavaScript</text>
  
  <circle cx="10" cy="85" r="7" fill="#D4A373"/>
  <text x="26" y="89" fill="#2c241d" class="text-main" font-size="10" font-weight="bold">Other</text>
  
  <circle cx="10" cy="110" r="7" fill="hsl(72, 60%, 49%)"/>
  <text x="26" y="114" fill="#2c241d" class="text-main" font-size="10" font-weight="bold">Java</text>
  
  <circle cx="10" cy="135" r="7" fill="#D41F26"/>
  <text x="26" y="139" fill="#2c241d" class="text-main" font-size="10" font-weight="bold">C++</text>
</g>

<text x="250" y="328" text-anchor="middle" fill="#8c7a6b" class="text-main" font-size="8">auto-updated daily · github.com/AHMADMALIK1376</text>
</svg>
